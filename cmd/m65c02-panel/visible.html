<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visible Computer · 65C02 Internals</title>
<style>
:root{font:14px system-ui,sans-serif;color:#e4ebdf;background:#111922}*{box-sizing:border-box}
body{margin:0;padding:18px;max-width:1600px;margin-inline:auto}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
h1{font-size:24px;margin:0}h2{font-size:16px;margin:0 0 12px}.muted{color:#a8bcaf}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:15px 0}
button,a.tool{border:1px solid #547667;background:#243d36;color:#e8f1e4;padding:8px 11px;border-radius:5px;cursor:pointer;text-decoration:none}
button:disabled{opacity:.4}button.on{background:#6a5124;border-color:#e4b65c}button.selected{background:#4b684b}
.layout{display:grid;grid-template-columns:minmax(250px,1fr) minmax(460px,3fr);gap:16px}
.panel{border:1px solid #3e5956;border-radius:7px;background:#19272c;padding:15px;min-width:0}
.cycles{max-height:640px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.cycles button{text-align:left;font:12px monospace;white-space:pre;background:#1c3035}
.cycles button.selected{background:#50664e}.mono{font:13px ui-monospace,monospace;white-space:pre-wrap}
.step-list{max-height:580px;overflow:auto}.step{padding:10px;margin:7px 0;background:#102126;border-left:3px solid #688f85;font:13px ui-monospace,monospace}
.step.bus{border-color:#daa54c}.step.post{border-color:#76b5df}.phase{color:#e4bf79}.delta{margin:7px 0 0;color:#bce0c7;word-break:break-word}
@media(max-width:850px){.layout{grid-template-columns:1fr}.cycles{max-height:250px}}
</style></head><body>
<header><div><h1>Visible Computer <span class="muted">/ CPU internals</span></h1><p class="muted">Executed micro-operations and state transitions, correlated with each physical bus cycle.</p></div><nav><a class="tool" href="/">KIM-1 PANEL</a> <a class="tool" href="/analyzer">LOGIC ANALYZER</a></nav></header>
<div id="status" class="muted">Connecting…</div>
<div class="toolbar"><button id="capture">START MICRO CAPTURE</button><button id="pause">PAUSE</button><button id="step">STEP CYCLE</button><button id="instruction">STEP INSTRUCTION</button><button id="older">◀ OLDER</button><button id="newer">NEWER ▶</button><button id="live">LIVE</button><span id="window" class="muted"></span></div>
<div class="layout">
 <section class="panel"><h2>Bus cycles</h2><div class="muted">Select a cycle to inspect its executed microsteps.</div><div class="cycles" id="cycles"></div></section>
 <section class="panel"><h2>CPU micro-operations</h2><div id="summary" class="mono">No cycle selected.</div><div id="steps" class="step-list"></div></section>
</div>
<script>
(()=>{'use strict';
 const $=id=>document.getElementById(id),hex=(n,w)=>Number(n).toString(16).toUpperCase().padStart(w,'0');
 const registerNames=['PC','A','X','Y','S','P','IR','AD','DO','DL','Lo','Hi','Operand','Offset','Base','EA'];
 const wide=new Set(['PC','AD','Base','EA']);
 let rows=[],steps=[],enabled=false,running=false,powered=true,selected=null,before=0,live=true,follow=true,history=[];
 async function post(control,down=true){const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({control,down})});if(!r.ok)throw Error(await r.text());}
 async function refresh(){
  try{const q='?micro=1'+(before?'&before='+before:'');const r=await fetch('/api/trace'+q,{cache:'no-store'});if(!r.ok)throw Error(await r.text());
   const data=await r.json();rows=data.rows||[];steps=data.micro||[];enabled=!!data.microEnabled;running=data.running;powered=data.powered;
   $('status').textContent=(live?'LIVE':'HISTORY')+' · '+(running?'RUNNING':'PAUSED')+' · '+data.cycle+' PHYSICAL CYCLES';
   $('capture').textContent=enabled?'STOP MICRO CAPTURE':'START MICRO CAPTURE';$('capture').classList.toggle('on',enabled);
   $('pause').textContent=running?'PAUSE':'RESUME';$('step').disabled=running||!powered;$('instruction').disabled=running||!powered;
   $('older').disabled=!rows.length;$('newer').disabled=live||!history.length;
   $('window').textContent=rows.length?rows[0].cycle+'–'+rows[rows.length-1].cycle:'No bus cycles retained';
   if(follow||selected===null||!rows.some(c=>c.cycle===selected))selected=rows.length?rows[rows.length-1].cycle:null;
   render();
  }catch(e){$('status').textContent='ERROR: '+e.message;}
 }
 function render(){const container=$('cycles');container.replaceChildren();
  for(const c of rows){const b=document.createElement('button');b.textContent=String(c.cycle).padStart(10)+'  $'+hex(c.address,4)+'  '+(c.write?'W':'R')+' $'+hex(c.data,2)+(c.sync?'  SYNC':'');b.classList.toggle('selected',selected===c.cycle);b.onclick=()=>{selected=c.cycle;follow=false;render();};container.appendChild(b);}
  const c=rows.find(c=>c.cycle===selected),list=$('steps');list.replaceChildren();
  $('summary').textContent=c?'CYCLE '+c.cycle+'  '+(c.sync?'OPCODE FETCH  ':'')+'$'+hex(c.address,4)+'  '+(c.write?'WRITE':'READ ')+' $'+hex(c.data,2):'No bus cycle selected';
  if(!enabled){notice('Micro capture is OFF. Start it, then pause or step to inspect CPU internals.');return;}
  if(!c){notice('No cycle selected.');return;}
  const current=steps.filter(s=>s.cycle===c.cycle);
  if(!current.length){notice('No internal steps retained for this bus cycle. Capture may have started later, or its bounded history may have wrapped.');return;}
  for(let i=0;i<current.length;i++){
   const s=current[i],div=document.createElement('div');div.className='step '+s.phase.toLowerCase();
   const head=document.createElement('div');head.textContent=String(i+1).padStart(2,'0')+' · '+s.phase+' · '+s.operation;head.className='phase';div.appendChild(head);
   const delta=registerNames.filter(k=>s.before[k]!==s.after[k]).map(k=>k+': $'+hex(s.before[k],wide.has(k)?4:2)+' → $'+hex(s.after[k],wide.has(k)?4:2));
   const changes=document.createElement('div');changes.className='delta';changes.textContent=delta.join('    ')||'No register/latch change';div.appendChild(changes);list.appendChild(div);
  }
 }
 function notice(message){const div=document.createElement('p');div.className='muted';div.textContent=message;$('steps').appendChild(div);}
 $('capture').onclick=async()=>{try{const r=await fetch('/api/trace/micro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!enabled})});if(!r.ok)throw Error(await r.text());await refresh();}catch(e){$('status').textContent=e.message;}};
 for(const [id,control,down] of [['pause','PAUSE',()=>running],['step','STEP',()=>true],['instruction','INSTRUCTION',()=>true]])$(id).onclick=async()=>{try{await post(control,down());live=true;follow=true;before=0;history=[];await refresh();}catch(e){$('status').textContent=e.message;}};
 $('older').onclick=async()=>{try{if(running){await post('PAUSE',true);await refresh();}if(!rows.length)return;history.push(before);before=rows[0].cycle;live=false;follow=true;await refresh();}catch(e){$('status').textContent=e.message;}};
 $('newer').onclick=async()=>{if(!history.length)return;before=history.pop();live=false;follow=true;await refresh();};
 $('live').onclick=()=>{before=0;history=[];live=true;follow=true;refresh();};
 refresh();setInterval(()=>{if(live)refresh();},350);
})();
</script></body></html>
